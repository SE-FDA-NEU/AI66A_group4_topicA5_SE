# Lint config for the backend. Pinned in CI (ruff==0.17.2); keep the rule
# families explicit so a ruff upgrade cannot silently change what is checked.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "RUF"]
# Not part of the ruff 0.17 default set that was in effect before this config
# existed; ignored so adopting the config does not widen the lint scope.
ignore = ["B904", "B905", "C416", "E702", "UP042"]

[lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]
