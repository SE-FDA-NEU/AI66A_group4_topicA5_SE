name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (backend/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend scripts
      - run: python -m pytest -v --cov=backend/app --cov-report=term-missing --cov-fail-under=90
      - name: Seed smoke test
        working-directory: backend
        run: |
          cp .env.example .env
          python -m app.init_secrets
          python -m app.migrate
          python -m app.seed
          python -m app.seed

  frontend-tests:
    name: Frontend build and tests (frontend/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  postgres-tests:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: credit_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Test on disposable Postgres
        env:
          M5_TEST_POSTGRES_URL: postgresql+psycopg://ci_user:ci_disposable_only@localhost:5432/credit_ci
        run: python scripts/postgres_smoke.py

  browser-tests:
    name: Browser P0 and role workflows
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: npx --prefix frontend playwright install chromium
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results
          retention-days: 7

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_secrets.py

  test:
    name: M5 release gate
    needs: [backend-tests, frontend-tests, postgres-tests, browser-tests, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), 'Release gate blocked'
          print('All release checks passed. Render may deploy this main commit.')
          PY
