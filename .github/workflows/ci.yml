name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

# Cancel an in-progress run when new commits are pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (backend/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Test
        # Run from the repository root (root pytest.ini sets testpaths/pythonpath).
        # Tests use an in-memory SQLite database, so no service container is needed.
        run: python -m pytest -v --cov=backend/app --cov-report=term-missing --cov-fail-under=90

      - name: Seed smoke test (same step as docs/SETUP.md)
        # Exercise the documented secret/schema/seed setup on the CI checkout.
        working-directory: backend
        run: |
          cp .env.example .env
          python -m app.init_secrets
          python -m app.migrate
          python -m app.seed

  # The `detect` job only looks for package.json at the repository root, where
  # this project has none, so the generic Node job never ran. Same fix as
  # `backend-tests` above: name the folder explicitly and drop the gate.
  frontend-tests:
    name: Frontend build and tests (frontend/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # Without this, setup-node looks for a lockfile at the root and fails.
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, not `npm install`: it fails loudly when package-lock.json and
      # package.json have drifted apart, which is what we want CI to catch.
      - run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for obvious credentials
        run: |
          # Deliberately simple and readable - students should be able to read this
          # and understand why their commit was blocked.
          PATTERN='(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----|password\s*=\s*["'"'"'][^"'"'"']{6,})'
          if git grep -nIE "$PATTERN" -- . ':!*.md' ':!.github/workflows/*' ; then
            echo "::error::A credential-looking string was found. Move it to an environment variable and rotate the key."
            exit 1
          fi
          echo "Clean."

      - name: No .env or database dumps
        run: |
          if git ls-files | grep -E '^(.*/)?\.env$|\.sql$|\.sqlite3?$|\.dump$' ; then
            echo "::error::Environment files or database dumps must not be committed. Add them to .gitignore."
            exit 1
          fi
          echo "Clean."