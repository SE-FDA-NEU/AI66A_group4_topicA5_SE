name: Public health monitor
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the public app and its database
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: python scripts/check_live.py
