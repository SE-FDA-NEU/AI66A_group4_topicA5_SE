<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1540" viewBox="0 0 1900 1540" role="img" aria-labelledby="title desc">
<title id="title">M3 entity relationship diagram - Credit Scoring Demo</title>
<desc id="desc">All four runtime tables and fields including account activation/token version and encrypted bank account columns. Required owner/result foreign keys restrict deletion; optional audit references use SET NULL.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#52647c"/></marker></defs>
<rect width="1900" height="1540" fill="#f5f8fc"/>
<text x="40" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#172b4d">M3 data model: backend/app/models.py</text>
<text x="40" y="87" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#172b4d">PK = primary key; FK = foreign key; ? = nullable. Dates use DateTime(timezone=True), normalized as UTC.</text>
<rect x="40" y="130" width="760" height="412" rx="12" fill="#ffffff" stroke="#aabbd1" stroke-width="2"/>
<path d="M52 130 H788 Q800 130 800 142 V182 H40 V142 Q40 130 52 130 Z" fill="#183d69"/>
<text x="60" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">users</text>
<text x="60" y="213" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">id: VARCHAR PK (UUID)</text>
<text x="60" y="243" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">email: VARCHAR UNIQUE NOT NULL [indexed]</text>
<text x="60" y="273" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">hashed_password: VARCHAR NOT NULL</text>
<text x="60" y="303" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">full_name: VARCHAR NOT NULL</text>
<text x="60" y="333" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">role: VARCHAR(20) NOT NULL [user/admin]</text>
<text x="60" y="363" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">failed_login_count: INTEGER NOT NULL default 0</text>
<text x="60" y="393" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">locked_until: DateTime?</text>
<text x="60" y="423" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">is_active: BOOLEAN NOT NULL default TRUE</text>
<text x="60" y="453" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">token_version: INTEGER NOT NULL default 0</text>
<text x="60" y="483" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">created_at: DateTime NOT NULL</text>
<text x="60" y="513" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">Role / active state / token version enforce BR8.</text>
<rect x="980" y="130" width="880" height="676" rx="12" fill="#ffffff" stroke="#aabbd1" stroke-width="2"/>
<path d="M992 130 H1848 Q1860 130 1860 142 V182 H980 V142 Q980 130 992 130 Z" fill="#183d69"/>
<text x="1000" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">loan_applications</text>
<text x="1000" y="213" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">id: VARCHAR PK (UUID)</text>
<text x="1000" y="243" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">created_by: VARCHAR FK -&gt; users.id [NOT NULL]</text>
<text x="1000" y="273" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">monthly_income: BIGINT NOT NULL CHECK &gt; 0</text>
<text x="1000" y="303" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">loan_amount: BIGINT NOT NULL CHECK &gt; 0</text>
<text x="1000" y="333" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">loan_term_months: INTEGER NOT NULL CHECK &gt; 0</text>
<text x="1000" y="363" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">estimated_monthly_payment: BIGINT NOT NULL</text>
<text x="1000" y="393" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">credit_history_note: TEXT?; purpose: VARCHAR?</text>
<text x="1000" y="423" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">cic_debt_group: INTEGER? CHECK 1..5</text>
<text x="1000" y="453" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">citizen_id_encrypted: VARCHAR?</text>
<text x="1000" y="483" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">citizen_id_last4: VARCHAR(4)?</text>
<text x="1000" y="513" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">bank_account_encrypted: VARCHAR?</text>
<text x="1000" y="543" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">bank_account_last4: VARCHAR(4)?</text>
<text x="1000" y="573" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">status: VARCHAR(20) NOT NULL default pending</text>
<text x="1000" y="603" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">dsr_flag_high_risk: BOOLEAN NOT NULL default FALSE</text>
<text x="1000" y="633" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">created_at: DateTime NOT NULL [indexed]</text>
<text x="1000" y="663" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">updated_at: DateTime NOT NULL</text>
<text x="1000" y="693" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">Owner FK: ON DELETE RESTRICT.</text>
<text x="1000" y="721" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">Composite index (created_by, created_at).</text>
<text x="1000" y="749" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">Status: pending / scored / manual_review /</text>
<text x="1000" y="777" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">        rejected / cancelled / approved.</text>
<rect x="40" y="745" width="760" height="348" rx="12" fill="#ffffff" stroke="#aabbd1" stroke-width="2"/>
<path d="M52 745 H788 Q800 745 800 757 V797 H40 V757 Q40 745 52 745 Z" fill="#183d69"/>
<text x="60" y="780" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">event_logs</text>
<text x="60" y="828" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">id: VARCHAR PK (UUID)</text>
<text x="60" y="858" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">actor_id: VARCHAR? FK -&gt; users.id</text>
<text x="60" y="888" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">loan_application_id: VARCHAR? FK -&gt; loan_applications.id</text>
<text x="60" y="918" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">action: VARCHAR NOT NULL</text>
<text x="60" y="948" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">detail: TEXT?</text>
<text x="60" y="978" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">created_at: DateTime NOT NULL [indexed]</text>
<text x="60" y="1008" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">Both nullable FKs: ON DELETE SET NULL.</text>
<text x="60" y="1036" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">Identifier values in audit details are masked.</text>
<text x="60" y="1064" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">Approval actor/time are read from loan.approved events.</text>
<rect x="980" y="925" width="880" height="438" rx="12" fill="#ffffff" stroke="#aabbd1" stroke-width="2"/>
<path d="M992 925 H1848 Q1860 925 1860 937 V977 H980 V937 Q980 925 992 925 Z" fill="#183d69"/>
<text x="1000" y="960" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">scoring_results</text>
<text x="1000" y="1008" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">id: VARCHAR PK (UUID)</text>
<text x="1000" y="1038" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">loan_application_id: VARCHAR FK [NOT NULL]</text>
<text x="1000" y="1068" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">score: INTEGER? CHECK NULL or 0..100</text>
<text x="1000" y="1098" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">label: VARCHAR(20)? [rejected/review/eligible]</text>
<text x="1000" y="1128" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">explanation: JSON?</text>
<text x="1000" y="1158" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">rejected_reason: VARCHAR?</text>
<text x="1000" y="1188" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">model_version: VARCHAR?</text>
<text x="1000" y="1218" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">input_snapshot: JSON?</text>
<text x="1000" y="1248" font-family="Consolas, monospace" font-size="18" font-weight="normal" fill="#172b4d">created_at: DateTime NOT NULL</text>
<text x="1000" y="1278" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">Application FK: ON DELETE RESTRICT.</text>
<text x="1000" y="1306" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">Composite index (loan_application_id, created_at).</text>
<text x="1000" y="1334" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#54677f">BR5 fourth request: audit only, no result row.</text>
<polyline points="800,241 980,241" fill="none" stroke="#52647c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="828" y="224" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#40546e">1 -&gt; 0..*</text>
<polyline points="260,560 260,745" fill="none" stroke="#52647c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="280" y="656" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#40546e">0..1 -&gt; 0..*</text>
<polyline points="980,650 870,650 870,882 800,882" fill="none" stroke="#52647c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="816" y="700" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#40546e">0..1 -&gt; 0..*</text>
<polyline points="1420,814 1420,925" fill="none" stroke="#52647c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1440" y="884" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#40546e">1 -&gt; 0..*</text>
<text x="40" y="1420" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#172b4d">Current schema source is models.py; migrate.py adds missing identifier and active/version columns without deleting rows.</text>
<text x="40" y="1455" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#172b4d">No plaintext identifier columns; keys live outside the database. Synthetic seed records are runtime demo data, not training data.</text>
<text x="40" y="1490" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#172b4d">Existing architecture.jpg / erd.png are retained as historical M2 artifacts; these editable SVGs describe M3.</text>
</svg>
