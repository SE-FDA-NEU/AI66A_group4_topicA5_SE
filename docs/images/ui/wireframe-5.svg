<svg xmlns="http://www.w3.org/2000/svg" width="828" height="712" viewBox="0 0 828 712" role="img" aria-labelledby="title description">
  <title id="title">Protected identifiers wireframe</title>
  <desc id="description">Masked, loading, empty, error and revealed states on Application details; all shown numbers are synthetic.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <g font-family="monospace" font-size="14" fill="#172b4d" xml:space="preserve">
    <text x="16" y="28">2.5 Protected identifiers - on /loan-applications/:id</text>
    <text x="16" y="48">The user comes here to check identifiers for an application they may open.</text>
    <text x="16" y="68">Calls: POST /api/loan-applications/{id}/sensitive-data/reveal</text>
    <text x="16" y="88"></text>
    <text x="16" y="108">+ Masked / default ------------------------------------------------------------------------+</text>
    <text x="16" y="128">| Protected identifiers                                                                    |</text>
    <text x="16" y="148">| Citizen ID: ********8901      Bank account: ********0123                                 |</text>
    <text x="16" y="168">| Viewing full numbers records your account and time in the access log.                    |</text>
    <text x="16" y="188">| [ View full numbers (logged) ]                                                           |</text>
    <text x="16" y="208">+------------------------------------------------------------------------------------------+</text>
    <text x="16" y="228"></text>
    <text x="16" y="248">+ Loading ---------------------------------------------------------------------------------+</text>
    <text x="16" y="268">| Citizen ID: ********8901      Bank account: ********0123                                 |</text>
    <text x="16" y="288">| [ Opening... ] (disabled)                                                                |</text>
    <text x="16" y="308">+------------------------------------------------------------------------------------------+</text>
    <text x="16" y="328"></text>
    <text x="16" y="348">+ Empty - neither identifier was provided -------------------------------------------------+</text>
    <text x="16" y="368">| Citizen ID: Not provided      Bank account: Not provided                                 |</text>
    <text x="16" y="388">| The lookup button is not shown.                                                          |</text>
    <text x="16" y="408">+------------------------------------------------------------------------------------------+</text>
    <text x="16" y="428"></text>
    <text x="16" y="448">+ Error -----------------------------------------------------------------------------------+</text>
    <text x="16" y="468">| &lt;API message&gt;                                                                            |</text>
    <text x="16" y="488">| Citizen ID: ********8901      Bank account: ********0123                                 |</text>
    <text x="16" y="508">| [ View full numbers (logged) ] - retry                                                   |</text>
    <text x="16" y="528">+------------------------------------------------------------------------------------------+</text>
    <text x="16" y="548"></text>
    <text x="16" y="568">+ Revealed - synthetic example values -----------------------------------------------------+</text>
    <text x="16" y="588">| Citizen ID: 012345678901      Bank account: 000123450123                                 |</text>
    <text x="16" y="608">| [ Hide numbers ]                                                                         |</text>
    <text x="16" y="628">+------------------------------------------------------------------------------------------+</text>
    <text x="16" y="648"></text>
    <text x="16" y="668">Full values hide after 30 seconds, on window blur or when the tab is hidden.</text>
    <text x="16" y="688">Both owner and Manager access are checked by the API before lookup.</text>
  </g>
</svg>
